name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-profinet against the reference implementations of
# otfabric/profinet-interop (p-net, pnio-rs, profinet-py, pnio-dcp; scapy and
# tshark decode every capture) on Docker bridge networks. The images are
# built here from profinet-interop's source: the GPL ones are not published.
# INTEROP_REF pins the profinet-interop release (keep it equal to the
# Makefile's); run the workflow by hand with interop_ref=main to try its head.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      interop_ref:
        description: "profinet-interop ref to build the images from"
        required: false

permissions:
  contents: read

env:
  INTEROP_REF: ${{ inputs.interop_ref || 'v0.7.1' }}
  GOWORK: "off"

jobs:
  interop:
    name: p-net + pnio-rs + profinet-py + pnio-dcp, controller and device
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Build the reference images
        # Once more on failure: a Debian mirror mid-sync fails apt-get with
        # a hash mismatch now and then.
        run: |
          make interop-images PROFINET_INTEROP_DIR="$RUNNER_TEMP/profinet-interop" ||
            { sleep 30; make interop-images PROFINET_INTEROP_DIR="$RUNNER_TEMP/profinet-interop"; }

      - name: Interop tests
        run: make test-interop

      # The hosted runners cannot run microchip-ung/mrp (switchdev built
      # in), so its ring tests record n/a here; the Kernel MRP workflow is
      # their evidence. profinet-interop's matrix leaves them out (since
      # v0.7.0 it refuses a check without a stable ID), so the matrix is
      # built from a copy without them; the upload keeps every result.
      - name: Matrix
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/matrix-results"
          cp interop-results/*.json "$RUNNER_TEMP/matrix-results/"
          rm -f "$RUNNER_TEMP"/matrix-results/TestMRP*_mrp.json
          make interop-matrix PROFINET_INTEROP_DIR="$RUNNER_TEMP/profinet-interop" PROFINET_INTEROP_RESULTS="$RUNNER_TEMP/matrix-results"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-results
          path: |
            interop-results/
            ${{ runner.temp }}/profinet-interop/docs/MATRIX.md
            ${{ runner.temp }}/profinet-interop/matrix/results.json
