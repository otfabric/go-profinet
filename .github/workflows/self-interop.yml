name: Self-interop
run-name: "Self-interop against profinet-interop-otfabric:latest, by @${{ github.actor }} on ${{ github.ref_name }}"

# Manual only. This commit against the latest published image of go-profinet itself
# (ghcr.io/otfabric/profinet-interop-otfabric:latest, from otfabric/profinet-interop),
# as IO-Device and as IO-Controller (interop/otfabric_test.go), on a Docker
# bridge network. The e2e tests run both sides from one commit; this one finds
# a change on the wire that breaks an earlier release.
#
# Not part of the Interop workflow, which runs against the independent references,
# and never a required check. Nothing is pinned or committed, so it cannot ask for
# a release. A pass is not independent verification (INTEROPERABILITY.md).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/otfabric/profinet-interop-otfabric:latest

jobs:
  self-interop:
    name: This commit against profinet-interop-otfabric:latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Pull the image
        run: docker pull "${IMAGE}"

      - name: Versions
        id: versions
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Versions"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| go-profinet under test | \`${REF}\` at \`${SHA}\` (\`$(git describe --tags --always)\`) |"
            echo "| Go | \`$(go env GOVERSION)\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Image digest | \`${digest}\` |"
            echo "| Image reports | \`$(docker run --rm "${IMAGE}" version)\` |"
            docker run --rm "${IMAGE}" print-capabilities | jq -r '"| go-profinet in the image | `\(.upstream.version)` at `\(.upstream.revision)` |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        env:
          PROFINET_INTEROP_OTFABRIC_IMAGE: ${{ steps.versions.outputs.digest }}
        run: |
          set -o pipefail
          GOWORK=off go test -v -tags interop -count=1 -timeout 25m -run '^TestOtfabric' ./interop/ 2>&1 | tee interop.log
          {
            echo "## Result"
            echo
            echo "- $(grep -c -- '--- PASS' interop.log) passed, $(grep -c -- '--- SKIP' interop.log) skipped, $(grep -c -- '--- FAIL' interop.log) failed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
