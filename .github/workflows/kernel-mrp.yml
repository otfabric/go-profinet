# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Kernel MRP
run-name: "Kernel MRP (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# The MRP interop tests against microchip-ung/mrp, the Linux bridge's MRP
# with Microchip's daemon. It needs a kernel with CONFIG_BRIDGE_MRP and
# without CONFIG_NET_SWITCHDEV, which no hosted runner has: the job builds
# one (scripts/mrp-kernel.sh, cached) and runs the tests in a virtme-ng
# micro-VM with a Docker daemon inside (scripts/microvm-interop.sh). amd64
# only: GitHub's arm64 runners have no /dev/kvm.
#
# One micro-VM per runner: each test is a matrix entry. Five micro-VMs one
# after another on one runner took 25 minutes, and twice a micro-VM that
# followed another one never ran its script (runs 45009761756 and
# 45011852118); the first micro-VM on a runner never failed. The job takes
# as long as its slowest test (TestMRPRingFaults, about 8 minutes) plus
# setup.

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_call:
    inputs:
      interop_ref:
        description: "profinet-interop ref to build the images from"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      interop_ref:
        description: "profinet-interop ref to build the images from"
        required: false

permissions:
  contents: read

env:
  INTEROP_REF: ${{ inputs.interop_ref || 'v0.13.0' }}
  KERNEL: v6.12
  GOWORK: "off"

jobs:
  kernel-mrp:
    name: microchip-ung/mrp ${{ matrix.name }}
    runs-on: ubuntu-24.04   # arm64 runners have no /dev/kvm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: otf-manager, run: 'TestMRPOtfManager/^mrp$' }
          - { name: otf-client, run: 'TestMRPOtfClient/^mrp$' }
          - { name: ring-faults, run: 'TestMRPRingFaults/^mrp$' }
          - { name: auto-go-profinet-best, run: 'TestMRPAuto/^mrp$/go-profinet-best' }
          - { name: auto-peer-best, run: 'TestMRPAuto/^mrp$/peer-best' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: KVM and virtme-ng
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils busybox-static udev flex bison bc libelf-dev libssl-dev >/dev/null
          pipx install virtme-ng

      - name: Kernel cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kernel/bzImage
          key: mrp-kernel-${{ env.KERNEL }}-${{ hashFiles('scripts/mrp-kernel.sh') }}

      - name: Build the kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          img=$(scripts/mrp-kernel.sh "$KERNEL" "$RUNNER_TEMP/src")
          mkdir -p "$RUNNER_TEMP/kernel" && cp "$img" "$RUNNER_TEMP/kernel/bzImage"

      # Saved at once, whatever the tests do.
      - name: Save the kernel
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kernel/bzImage
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build the reference images (the MRP peers and the decoders)
        run: |
          git clone --quiet https://github.com/otfabric/profinet-interop.git "$RUNNER_TEMP/profinet-interop"
          git -C "$RUNNER_TEMP/profinet-interop" checkout --quiet "$INTEROP_REF"
          make -C "$RUNNER_TEMP/profinet-interop" image-mrp image-umrp image-scapy image-tshark

      - name: MRP test in the micro-VM
        env:
          RUN: ${{ matrix.run }}
        run: scripts/microvm-interop.sh "$RUNNER_TEMP/kernel/bzImage" "$RUN"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-mrp-results-${{ matrix.name }}
          path: interop-results/
